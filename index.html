<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Choice Is Yours</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>The Choice Is Yours</h1>
            <div id="karma-container">
                <span id="karma-label">Karma: </span>
                <span id="karma-score">0</span>
            </div>
            <div id="karma-bar-container">
                <div id="karma-bar"></div>
            </div>
            <div id="day-counter">Day 1</div>
        </header>
        <main>
            <div id="scenario-container">
                <p id="scenario-emoji"></p>
                <p id="scenario-text"></p>
            </div>
            <div id="choices-container">
                <button class="choice-btn" id="choice-1"></button>
                <button class="choice-btn" id="choice-2"></button>
            </div>
            <div id="ending-container" class="hidden">
                <h2 id="ending-title"></h2>
                <p id="ending-text"></p>
                <button id="play-again-btn">Play Again</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
