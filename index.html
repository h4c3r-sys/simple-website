<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Racer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="setup-screen">
        <h1 id="p1-prompt">Player 1: Press Your Key</h1>
        <h1 id="p2-prompt">Player 2: (Waiting...)</h1>

        <div id="difficulty-selection">
            <h3>Difficulty:</h3>
            <button class="difficulty-btn active" id="easy-btn">EASY</button>
            <button class="difficulty-btn" id="medium-btn">MEDIUM</button>
            <button class="difficulty-btn" id="hard-btn">HARD</button>
            <button class="difficulty-btn" id="extreme-btn">EXTREME</button>
        </div>

        <div id="track-length-selection">
            <h3>Track Length:</h3>
            <button class="length-btn active" id="short-track">SHORT</button>
            <button class="length-btn" id="medium-track">MEDIUM</button>
            <button class="length-btn" id="long-track">LONG</button>
        </div>

        <div id="music-selection">
            <h3>Choose Your Music:</h3>
            <label>
                <input type="radio" name="music" value="song1.mp3" checked> Song 1
            </label>
            <label>
                <input type="radio" name="music" value="song2.mp3"> Song 2
            </label>
            <label>
                <input type="radio" name="music" value="song3.mp3"> Song 3
            </label>
        </div>
        <p id="start-prompt" class="hidden">Press ENTER to Start</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="message-area"></div>
        <div class="track-container">
            <div id="p1-track" class="track"></div>
        </div>
        <div class="track-container">
            <div id="p2-track" class="track"></div>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <h1 id="end-message"></h1>
        <button id="play-again-btn">Play Again</button>
    </div>

    <audio id="game-music" loop></audio>
    <audio id="sfx-countdown"></audio>
    <audio id="sfx-keypress"></audio>
    <audio id="sfx-win"></audio>
    <audio id="sfx-lose"></audio>

    <script src="script.js"></script>
</body>
</html>
