<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Mega Math Quiz</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quiz-container {
            background-color: white;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            width: 50%;
        }
        #question {
            font-size: 2rem;
            margin-bottom: 1rem;
            min-height: 50px;
        }
        #answer {
            padding: 0.5rem;
            font-size: 1rem;
        }
        #submit {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
        #score {
            margin-top: 1rem;
            font-size: 1.2rem;
        }
        #feedback {
            margin-top: 1rem;
            font-size: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Ultra Mega Math Quiz</h1>
        <div id="question"></div>
        <input type="text" id="answer" placeholder="Your answer...">
        <button id="submit">Submit</button>
        <div id="score">Score: 0 | Level: 1</div>
        <div id="feedback"></div>
    </div>
    <script src="quiz.js"></script>
</body>
</html>
